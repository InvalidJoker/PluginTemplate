[versions]
userdev = "2.0.0-beta.19"
pluginyml = "0.6.0"
commandapi = "11.2.0"
paper = "1.21.11"
kotlinx-serialization-json = "1.11.0"
kotlinx-coroutines = "1.11.0"
run-paper = "3.0.2"
glue = "2026.5-SNAPSHOT"
shadow = "9.6.1"

[libraries]
commandapi-bukkit-shade = { group = "dev.jorel", name = "commandapi-paper-shade", version.ref = "commandapi" }
commandapi-bukkit-kotlin = { group = "dev.jorel", name = "commandapi-kotlin-paper", version.ref = "commandapi" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

glue-paper = { group = "dev.invalidjoker.glue", name = "paper", version.ref = "glue" }
glue-core = { group = "dev.invalidjoker.glue", name = "core", version.ref = "glue" }

[plugins]
userdev = { id = "io.papermc.paperweight.userdev", version.ref = "userdev" }
pluginyml-paper = { id = "net.minecrell.plugin-yml.paper", version.ref = "pluginyml" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }